name = "swole"
main = "src/runtimes/cf/worker.js"
compatibility_date = "2026-10-01"

# The UI is the local runtime bundle: same fetch transport, same origin.
[assets]
directory = "dist/local"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Create with `wrangler kv namespace create SWOLE_KV` and put its id here.
[[kv_namespaces]]
binding = "SWOLE_KV"
id = "REPLACE_WITH_NAMESPACE_ID"
