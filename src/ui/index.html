<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Workout</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="demo-banner" class="demo-banner" style="display: none">
      Demo mode: changes saved locally in your browser.
    </div>

    <div class="bar">
      <h1><a id="title" target="_blank" rel="noopener">Workout</a></h1>
      <div class="bar-actions">
        <span class="clock" id="clock">00:00:00</span>
        <button
          id="feedback-btn"
          class="icon-btn"
          type="button"
          title="Feedback / Issues"
          aria-label="Feedback / Issues"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
            />
          </svg>
        </button>
      </div>
    </div>

    <nav class="tabs-nav" aria-label="Views">
      <a
        id="tab-routine"
        class="tab-link disabled"
        target="_blank"
        rel="noopener"
        role="tab"
        aria-selected="false"
        >Routine</a
      >
      <button
        id="tab-session"
        class="tab-btn active"
        type="button"
        role="tab"
        aria-selected="true"
      >
        Session
      </button>
      <a
        id="tab-log"
        class="tab-link disabled"
        target="_blank"
        rel="noopener"
        role="tab"
        aria-selected="false"
        >Log</a
      >
    </nav>

    <div id="list" class="list"></div>

    <div class="foot">
      <div class="status" id="status"></div>
      <div class="foot-bar">
        <button
          id="add-btn"
          class="add-btn"
          type="button"
          title="Add exercise"
          aria-label="Add exercise"
        >
          +
        </button>
        <select id="day">
          <option value="MONDAY">MONDAY</option>
          <option value="TUESDAY">TUESDAY</option>
          <option value="WEDNESDAY">WEDNESDAY</option>
          <option value="THURSDAY">THURSDAY</option>
          <option value="FRIDAY">FRIDAY</option>
          <option value="SATURDAY">SATURDAY</option>
          <option value="SUNDAY">SUNDAY</option>
        </select>
        <button
          id="save"
          class="save-btn"
          type="button"
          title="Log session"
          aria-label="Log session"
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
            />
            <polyline points="17 21 17 13 7 13 7 21" />
            <polyline points="7 3 7 8 15 8" />
          </svg>
        </button>
      </div>
    </div>

    <div id="modal" class="modal-overlay" style="display: none">
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <div class="modal-head">
          <h2 id="modal-title">Add Exercise</h2>
          <button
            id="modal-close"
            class="icon-btn"
            type="button"
            aria-label="Close"
          >
            &times;
          </button>
        </div>
        <div class="modal-body">
          <label for="custom-name">Exercise Name</label>
          <input
            id="custom-name"
            type="text"
            placeholder="e.g. Lateral Raise"
            autocomplete="off"
          />
          <label for="custom-scheme">Scheme (optional)</label>
          <input
            id="custom-scheme"
            type="text"
            placeholder="e.g. 3x12-15"
            autocomplete="off"
          />
        </div>
        <div class="modal-foot">
          <button id="modal-add" class="primary-btn" type="button">
            Add to Workout
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
