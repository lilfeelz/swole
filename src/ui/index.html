<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Workout</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- DEMO_BANNER -->
    <div class="bar">
      <h1><a id="title" target="_blank" rel="noopener">Workout</a></h1>
      <div class="bar-actions">
        <span class="clock" id="clock">00:00:00</span>
        <button
          id="feedback-btn"
          class="icon-btn"
          type="button"
          title="Feedback / Issues"
          aria-label="Feedback / Issues"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
            />
          </svg>
        </button>
      </div>
    </div>

    <nav class="tabs" aria-label="Views">
      <a id="tab-routine" class="tab disabled" target="_blank" rel="noopener"
        >Routine</a
      >
      <span id="tab-session" class="tab active">Session</span>
      <a id="tab-log" class="tab disabled" target="_blank" rel="noopener"
        >Log</a
      >
    </nav>

    <div id="list" class="list"></div>

    <div class="foot">
      <div class="status" id="status"></div>
      <div class="foot-bar">
        <button
          id="add-btn"
          class="add-btn"
          type="button"
          title="Add exercise"
          aria-label="Add exercise"
        >
          +
        </button>
        <select id="day">
          <option value="MONDAY">MONDAY</option>
          <option value="TUESDAY">TUESDAY</option>
          <option value="WEDNESDAY">WEDNESDAY</option>
          <option value="THURSDAY">THURSDAY</option>
          <option value="FRIDAY">FRIDAY</option>
          <option value="SATURDAY">SATURDAY</option>
          <option value="SUNDAY">SUNDAY</option>
        </select>
        <button
          id="save"
          class="save-btn"
          type="button"
          title="Log session"
          aria-label="Log session"
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
            />
            <polyline points="17 21 17 13 7 13 7 21" />
            <polyline points="7 3 7 8 15 8" />
          </svg>
        </button>
      </div>
    </div>

    <div id="modal" class="modal-overlay" style="display: none">
      <div class="modal-card">
        <h2 class="modal-title">Add Exercise</h2>
        <input
          id="modal-input"
          type="text"
          placeholder="Exercise name"
          autocomplete="off"
          autocapitalize="words"
        />
        <div class="modal-actions">
          <button id="modal-cancel" class="btn-subtle" type="button">
            Cancel
          </button>
          <button id="modal-confirm" class="btn-pink" type="button">Add</button>
        </div>
      </div>
    </div>

    <div id="feedback-modal" class="modal-overlay" style="display: none">
      <div class="modal-card">
        <h2 class="modal-title">Feedback & Issues</h2>
        <div class="type-selector">
          <button id="type-bug" class="type-btn active" type="button">
            Bug
          </button>
          <button id="type-feature" class="type-btn" type="button">
            Feature
          </button>
        </div>
        <textarea
          id="feedback-input"
          placeholder="Describe what happened or your idea…"
          rows="4"
        ></textarea>
        <div class="modal-actions">
          <button id="feedback-cancel" class="btn-subtle" type="button">
            Cancel
          </button>
          <button
            id="feedback-file"
            class="btn-subtle"
            type="button"
            style="display: none"
          >
            Record
          </button>
          <button id="feedback-submit" class="btn-pink" type="button">
            Open on GitHub ↗
          </button>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
