name: Deploy Google Apps Script

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Google Apps Script Bundle
        run: npm run build

      - name: Push to Google Apps Script via Clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        if: env.CLASPRC_JSON != ''
        run: |
          mkdir -p ~/.clasprc.json
          echo "$CLASPRC_JSON" > ~/.clasprc.json
          npx @google/clasp push --rootDir dist/gas --force
