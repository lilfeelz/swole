name: deploy-gas

# Pushes dist/gas to the gswole Apps Script project and moves the fixed web app
# deployment to it, so the phone URL never changes. Auth: clasp OAuth refresh token
# in the CLASPRC_JSON secret (Apps Script has no OIDC).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gas
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: clasp auth
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME + '/.clasprc.json','utf8'))"
      - name: write .clasp.json
        env:
          CLASP_SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID }}
        run: |
          test -n "$CLASP_SCRIPT_ID"
          node -e "require('fs').writeFileSync('.clasp.json', JSON.stringify({ scriptId: process.env.CLASP_SCRIPT_ID, rootDir: 'dist/gas' }, null, 2))"
      - run: npx --yes @google/clasp@3.4.1 push --force
      - name: deploy
        env:
          GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
        run: npx --yes @google/clasp@3.4.1 deploy -i "$GAS_DEPLOYMENT_ID" -d "${{ github.sha }}"
